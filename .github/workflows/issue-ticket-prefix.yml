name: Issue Ticket Prefix

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  prefix-title:
    runs-on: ubuntu-latest
    steps:
      - name: Prefix title with WEB-<issue number>
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          prefix="WEB-${NUMBER}: "
          if [[ "$TITLE" == "$prefix"* ]]; then
            exit 0
          fi
          shopt -s nocasematch
          stripped="$TITLE"
          if [[ "$stripped" =~ ^\[TASK\]:?[[:space:]]*(.*)$ ]]; then
            stripped="${BASH_REMATCH[1]}"
          fi
          if [[ "$stripped" =~ ^WEB-[0-9]*:?[[:space:]]*(.*)$ ]]; then
            stripped="${BASH_REMATCH[1]}"
          fi
          gh issue edit "$NUMBER" --title "${prefix}${stripped}"
